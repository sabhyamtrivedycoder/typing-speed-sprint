<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TypeSprint — 60-Second Typing Speed Test</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="logo"><span>⚡</span><h1>TypeSprint</h1></div>
    <a href="https://sabhyamtrivedycoder.github.io/portfolio/" target="_blank" class="nav-portfolio">Portfolio ↗</a>
  </header>
  <main class="main">
    <div class="stats">
      <div>WPM: <span id="wpm">0</span></div>
      <div>Accuracy: <span id="acc">100%</span></div>
      <div>Time Left: <span id="time">60s</span></div>
    </div>
    <div class="target-box" id="targetText">The quick brown fox jumps over the lazy developer. Writing code every single day transforms complex ideas into scalable platforms.</div>
    <textarea id="typeInput" placeholder="Start typing here..."></textarea>
  </main>
  <footer>
    <p>Engineered by <a href="https://github.com/sabhyamtrivedycoder" target="_blank">Sabhyam Trivedy</a> • MIT License</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
